<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RVA.guru — New Local Apps Prototype</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --accent: #f59e0b;
      --text: #e7ecf3;
      --muted: #94a3b8;
      --green: #22c55e;
      --blue: #3b82f6;
      --pink: #ec4899;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-bottom: 1px solid #334155;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header h1 span { color: var(--accent); }
    .tag {
      font-size: 0.75rem;
      background: #334155;
      color: var(--muted);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.75rem 1rem;
      background: #111827;
      border-bottom: 1px solid #1e293b;
      overflow-x: auto;
    }
    .nav button {
      background: transparent;
      border: 1px solid #334155;
      color: var(--muted);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .nav button:hover, .nav button.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.25rem;
    }
    .app-panel { display: none; }
    .app-panel.active { display: block; }
    .panel-header {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .panel-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
    }
    .panel-header p {
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 560px;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .filters select, .filters input {
      background: var(--card);
      border: 1px solid #334155;
      color: var(--text);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.875rem;
    }
    .map-wrap {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1rem;
      height: 560px;
    }
    @media (max-width: 900px) {
      .map-wrap { grid-template-columns: 1fr; height: auto; }
      #map { height: 380px !important; }
    }
    #map {
      height: 100%;
      border-radius: 12px;
      border: 1px solid #334155;
      z-index: 1;
    }
    .list {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid #334155;
      overflow-y: auto;
      max-height: 560px;
    }
    .list-item {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid #1e293b;
      cursor: pointer;
      transition: background 0.12s;
    }
    .list-item:hover, .list-item.active {
      background: #243044;
    }
    .list-item h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.15rem;
    }
    .list-item .meta {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .list-item .badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      margin-top: 0.35rem;
      margin-right: 0.25rem;
    }
    .badge.price { background: #365314; color: #bbf7d0; }
    .badge.vibe { background: #1e3a5f; color: #93c5fd; }
    .badge.open { background: #14532d; color: #86efac; }
    .badge.closed { background: #450a0a; color: #fca5a5; }
    .popup h3 { margin-bottom: 0.25rem; font-size: 1rem; }
    .popup p { font-size: 0.85rem; color: #cbd5e1; margin: 0.2rem 0; }
    .note {
      background: #1e293b;
      border-left: 3px solid var(--accent);
      padding: 0.75rem 1rem;
      margin: 1rem 0;
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.1rem;
    }
    .card h3 { font-size: 1.05rem; margin-bottom: 0.4rem; }
    .card p { font-size: 0.875rem; color: var(--muted); }
    .card .tagline { color: var(--accent); font-size: 0.8rem; margin-bottom: 0.5rem; }
    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.8rem;
      border-top: 1px solid #1e293b;
      margin-top: 2rem;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>RVA<span>.guru</span> — New Apps Prototype</h1>
      <div class="tag">Richmond, Virginia · Local Tools</div>
    </div>
    <div style="font-size:0.85rem;color:var(--muted)">All 9 concepts in one place · Sample data</div>
  </header>

  <nav class="nav" id="nav">
    <button data-app="coffee" class="active">☕ Coffee Map</button>
    <button data-app="happy">🍻 Happy Hour</button>
    <button data-app="parks">🌲 Parks & Trails</button>
    <button data-app="markets">🥬 Markets & Trucks</button>
    <button data-app="commute">🚗 Commute & Parking</button>
    <button data-app="events">📅 Events</button>
    <button data-app="vibe">🏘️ Neighborhood Vibe</button>
    <button data-app="local">🛍️ Local Business</button>
    <button data-app="dogs">🐕 Dog-Friendly</button>
  </nav>

  <main>
    <!-- content truncated for tool call - full file will be pushed via alternative if needed -->
    <p>Loading full prototype...</p>
  </main>
</body>
</html>
